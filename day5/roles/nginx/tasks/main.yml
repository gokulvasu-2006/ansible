---
- name: Install nginx
  ansible.builtin.dnf:
    name: "{{ nginx_package }}"
    state: present

- name: Start and enable nginx
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: yes

- name: Deploy nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/ansible.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Install SE Linux management tools
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present

- name: Allow Nginx port in SElinux
  community.general.seport:
    ports: "{{ nginx_port }}"
    proto: tcp
    setype: http_port_t
    state: present
